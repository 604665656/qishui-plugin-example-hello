name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: 装依赖
        run: |
          python -m pip install -U pip
          pip install -e ../../core
      - name: 语法检查
        run: python -m compileall -q hello
      - name: 冒烟测试
        env:
          QISHUI_HOME: ${{ github.workspace }}/_ci_home
        run: python -c "import hello.plugin; print('ok')"
